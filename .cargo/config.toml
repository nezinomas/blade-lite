[alias]
# Hardware tests on the real laptop, one at a time so they do not share the controller.
# Only the test named runs: `cargo hw <test name>` (exact name; a unit test's
# name has its module path). The name given first matches only the test
# `cargo_hw_needs_a_test_name`, which fails when no other name is given, so a
# `cargo hw` with no name runs nothing else (ticket 289).
hw = [
    "test", "--workspace", "--", "--ignored", "--test-threads=1", "--exact",
    "cargo_hw_needs_a_test_name",
]
# Quiet test run: prints only failures and the totals.
t = "test --workspace -q"
# The app for a laptop check, built from this checkout in its own folder,
# so a running check app does not lock the exe that `cargo t` and pre-push rebuild.
app = "run -p blade-lite --target-dir target/app"
