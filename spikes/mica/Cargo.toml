[package]
name = "mica-spike"
description = "Throw-away check: does Mica show through a Slint window?"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, so it stays out of the main one.
[workspace]

[dependencies]
raw-window-handle = "0.6.2"
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
windows = { version = "0.62.2", features = [
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
] }
