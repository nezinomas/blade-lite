name: Release

# A version tag (such as v0.1.0) builds the app from the tag and makes a
# draft release with the installer, the exe and their SHA-256 sums.
# Publish the draft by hand.
# Built with --locked, actions pinned by commit, and no build cache, so no
# earlier run can change what is shipped (ticket 149).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Licences and advisories (deny.toml), checked again for the tagged commit.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  release:
    needs: deny
    # A named image, so an image change can't change the Inno Setup that
    # builds the installer unseen (`windows-latest` moves).
    runs-on: windows-2025
    permissions:
      # To make the draft release.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The whole history, to check the tag is on master.
          fetch-depth: 0
      # Only a tag on master that names the version in Cargo.toml.
      - name: Tag on master, version matches
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master ||
            { echo "The tag is not on master" >&2; exit 1; }
          version=$(grep -m1 '^version' Cargo.toml | tr -d '\r' | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" ||
            { echo "Tag $GITHUB_REF_NAME, Cargo.toml version $version" >&2; exit 1; }
      # The newest stable Rust on purpose; its version is in the job's log.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p blade-lite
      # The runner's Inno Setup 6 (its version is in the log), with the
      # exe built above (installer/blade-lite.iss).
      - name: Installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$($env:GITHUB_REF_NAME.Substring(1))" installer\blade-lite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # `sha256sum -c SHA256SUMS.txt` checks a download (LF line ends).
      - name: Files and SHA-256 sums
        shell: bash
        run: |
          mkdir dist
          cp target/release/blade-lite.exe target/installer/blade-lite-setup-*.exe dist/
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME"
