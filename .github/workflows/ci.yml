name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python -m unittest discover -s capture

  # Licences, security advisories, duplicate crates and sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Builds on the oldest Rust we support: `rust-version` in Cargo.toml.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        shell: bash
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | tr -d '\r' | cut -d'"' -f2)
          test -n "$version" || { echo "No rust-version in Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
