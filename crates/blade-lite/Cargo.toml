[package]
name = "blade-lite"
description = "The Blade 18 settings window."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blade-core = { path = "../blade-core" }
platform = { path = "../platform" }
razer-device = { path = "../razer-device" }
raw-window-handle = "0.6.2"
razer-proto = { path = "../razer-proto" }
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
thiserror = "2.0.21"
tray-icon = "0.26.1"
ui = { path = "../ui" }

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "1.18.1"

[dev-dependencies]
# Must match slint exactly. Draws the windows off screen for the window tests.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
png = "0.18.1"
proptest = "1.11.0"
tempfile = "3.27.0"

[lints]
workspace = true
